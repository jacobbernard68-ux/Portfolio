<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Backend and data systems architecture</title>
  <desc id="desc">React interfaces connect through Express REST APIs to MySQL and MongoDB data stores.</desc>
  <rect width="1200" height="760" fill="#17212d"/>
  <circle cx="1035" cy="98" r="220" fill="#2d4156" opacity=".55"/>
  <circle cx="135" cy="705" r="280" fill="#243345" opacity=".7"/>
  <text x="86" y="92" fill="#afc0d2" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="5">DATABASE &amp; BACKEND COURSEWORK · 2026</text>
  <text x="86" y="178" fill="#f2f6fa" font-family="Arial, sans-serif" font-size="66" font-weight="700">Backend &amp; Data Systems</text>
  <text x="86" y="222" fill="#afc0d2" font-family="Arial, sans-serif" font-size="25">Interfaces, APIs, and persistent data working as one system.</text>
  <g font-family="Arial, sans-serif">
