<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ERA Helpdesk hybrid data evidence</title><desc id="desc">Structured ticket information from MySQL shown alongside flexible MongoDB technician notes and activity.</desc>
  <rect width="1200" height="760" fill="#17212d"/><text x="70" y="82" fill="#afc0d2" font-family="Arial" font-size="20" font-weight="700" letter-spacing="4">ERA HELPDESK · HYBRID DATA</text><text x="70" y="142" fill="#f2f6fa" font-family="Arial" font-size="42" font-weight="700">One workflow, two data models</text>
  <rect x="70" y="195" width="500" height="480" rx="24" fill="#1b2633" stroke="#607795" stroke-width="2"/><text x="105" y="248" fill="#9fc5f4" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3">MYSQL · STRUCTURED TICKET</text><text x="105" y="305" fill="#f2f6fa" font-family="Arial" font-size="31" font-weight="700">Printer access request</text>
  <g font-family="Arial" font-size="19"><text x="105" y="365" fill="#afc0d2">Status</text><text x="360" y="365" fill="#f2f6fa">In progress</text><text x="105" y="414" fill="#afc0d2">Priority</text><text x="360" y="414" fill="#f2f6fa">Medium</text><text x="105" y="463" fill="#afc0d2">Department</text><text x="360" y="463" fill="#f2f6fa">Operations</text><text x="105" y="512" fill="#afc0d2">Assigned to</text><text x="360" y="512" fill="#f2f6fa">IT staff</text></g>
  <rect x="630" y="195" width="500" height="480" rx="24" fill="#243345" stroke="#607795" stroke-width="2"/><text x="665" y="248" fill="#9fc5f4" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3">MONGODB · NOTES &amp; ACTIVITY</text>
  <g font-family="Arial"><rect x="665" y="286" width="430" height="118" rx="15" fill="#2d4156"/><text x="690" y="324" fill="#f2f6fa" font-size="19" font-weight="700">Technician note</text><text x="690" y="360" fill="#d5e1ed" font-size="18">Driver updated and test page completed.</text><rect x="665" y="425" width="430" height="118" rx="15" fill="#2d4156"/><text x="690" y="463" fill="#f2f6fa" font-size="19" font-weight="700">Activity entry</text><text x="690" y="499" fill="#d5e1ed" font-size="18">Follow-up scheduled with requester.</text></g>
  <path d="M585 422h30" stroke="#9fc5f4" stroke-width="4"/><path d="m604 410 15 12-15 12" fill="none" stroke="#9fc5f4" stroke-width="4"/>
</svg>
