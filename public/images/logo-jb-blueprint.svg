<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Jacob Bernard monogram</title>
  <desc id="logo-description">A streamlined technical blueprint-style JB monogram.</desc>

  <!-- Construction geometry: intentionally quiet at small sizes. -->
  <g fill="none" stroke="#607795" stroke-linecap="round">
    <circle cx="80" cy="80" r="57" stroke-width="2.75" opacity=".55"/>
    <path d="M80 14v9M80 137v9M14 80h9M137 80h9" stroke-width="2.5" opacity=".62"/>
  </g>

  <!-- Primary J. -->
  <path d="M78 34v55c0 21-11 34-29 34-16 0-27-10-27-25 0-8 3-15 8-20"
        fill="none" stroke="#1f2937" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Primary B, sharing the same engineered stroke language. -->
  <path d="M96 60v77M96 64h15c15 0 25 8 25 19s-10 18-25 18H96M96 101h17c17 0 27 8 27 19s-10 17-27 17H96"
        fill="none" stroke="#1f2937" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Technical connection nodes. -->
  <g fill="#b7c5dd" stroke="#1f2937" stroke-width="4">
    <circle cx="78" cy="34" r="6"/>
    <circle cx="30" cy="78" r="6"/>
    <circle cx="96" cy="64" r="6"/>
  </g>
</svg>
