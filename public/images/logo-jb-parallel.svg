<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-labelledby="title desc">
  <title id="title">Jacob Bernard parallel-line monogram</title>
  <desc id="desc">The initials J and B constructed from evenly spaced parallel lines.</desc>

  <!-- Nested J paths -->
  <g fill="none" stroke="#080d14" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78 24v102c0 25-18 40-43 40-8 0-15-2-21-5"/>
    <path d="M65 24v102c0 17-12 27-30 27-8 0-15-3-21-8"/>
    <path d="M52 24v102c0 10-7 15-17 15-9 0-16-5-21-13"/>
  </g>

  <!-- Parallel B contours -->
  <g fill="none" stroke="#607795" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M94 24h31c27 0 43 14 43 34s-16 34-43 34H94M94 92h35c28 0 45 15 45 36s-17 36-45 36H94"/>
    <path d="M94 38h29c19 0 31 8 31 20s-12 20-31 20H94M94 106h33c20 0 32 9 32 22s-12 22-32 22H94"/>
    <path d="M94 52h27c11 0 19 2 19 6s-8 6-19 6H94M94 120h31c12 0 20 3 20 8s-8 8-20 8H94"/>
  </g>
</svg>
